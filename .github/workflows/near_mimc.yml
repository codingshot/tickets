name: near-mimc CI

on: 
  pull_request:
    paths:
      - 'packages/contract-libraries/near_mimc/**'

env:
  RUSTFLAGS: -D warnings

defaults:
  run:
    shell: bash
    working-directory: packages/contract-libraries/near_mimc

# Cancel superseded PR checks; keep every non-PR invocation independent.
concurrency:
  group: near_mimc.yml-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test_near_mimc:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          source $HOME/.cargo/env
          rustup component add rustfmt
          rustup target add wasm32-unknown-unknown

      - name: Install Yarn Globally
        run: npm install -g yarn

      - name: Installing Dependencies
        run: yarn

      - name: Rust Tests
        run: yarn test:near_mimc

      - name: Test build
        run: yarn build:near_mimc

      - name: Install Audit
        run: cargo install cargo-audit

      - name: Run Audit
        run: cargo audit --ignore RUSTSEC-2020-0071
